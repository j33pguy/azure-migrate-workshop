name: Validate workshop
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r tests/requirements.txt
      - run: pwsh -NoProfile -File tests/Validate-Repository.ps1
      - run: python tests/check_docs.py
      - run: python tests/check_payloads.py
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Validate-Repository.ps1
